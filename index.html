<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>词语寻宝纸 · Word Trails</title><link rel="stylesheet" href="style.css"><script defer src="puzzle.js"></script><script defer src="app.js"></script></head><body>
<header><p>THE LITTLE WORD CLUB</p><h1>把词语藏进一张纸。</h1><span>离线字阵小游戏 · 中文 / English / 数字</span></header>
<main><aside><form id="form"><label>纸张标题（最多24字符）<input id="title" maxlength="24" value="自然里的小发现"></label><label>一行一个词语<textarea id="words" rows="9" maxlength="2000">春风
花园
森林
星空
月光
海洋
山川
雨水</textarea></label><p class="note">1—20个词；每词2字符起，不超过字阵边长。全角转半角，英文转大写，重复词合并。不接受标点、空格或表情。</p><div class="pair"><label>字阵大小<select id="size"><option>8</option><option selected>10</option><option>12</option><option>16</option></select></label><label>随机种子<input id="seed" type="number" min="0" max="4294967295" value="2026" required></label></div><label class="check"><input id="reverse" type="checkbox">加入反向和更多斜向</label><button class="primary" type="submit">生成我的寻宝纸</button></form><div class="actions"><button id="question">导出题目 PNG</button><button id="answer">导出答案 PNG</button></div><button id="reset">恢复自然词表示例</button><p class="note">不存储词表。请勿输入真实个人信息。生成器不是字典，不检查词语含义或学习效果。</p></aside>
<section><div id="status" role="status" aria-live="polite"></div><h2 id="heading"></h2><p class="note">点击起点，再点击终点；横、竖、斜线都可以。键盘 Tab + 空格也可选格。</p><div class="boardwrap"><div id="board" aria-label="词语字阵"></div></div><ul id="clues" aria-label="待寻找词语"></ul><p id="progress" role="status"></p><p class="note">答案图标出的是生成路径，填充字符可能带来额外匹配；找到这些匹配也算正确。未放入的词会明确列出，不计入任务。</p></section></main><footer>零上传 · 零依赖 · 系统字体 · 题目和答案分开导出</footer></body></html>
